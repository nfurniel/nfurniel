# Genera la serpiente que se come el gráfico de contribuciones y la publica
# en la rama "output" de este repo, que es de donde la lee el README.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 3 * * *" # una vez al día, a las 03:00 UTC
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar los SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f5fbf&color_dots=#ebedf0,#ffe2a8,#ffc95c,#f5a300,#c27c00
            dist/snake-dark.svg?color_snake=#4c8dff&color_dots=#161b22,#4a3200,#8a5d00,#d18c00,#ffb31a

      - name: Publicarlos en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
